name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"   # 매시 7분: 실시간 혼잡도 갱신(SEOUL_API_KEY가 있을 때만 채워짐)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_live.py
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
